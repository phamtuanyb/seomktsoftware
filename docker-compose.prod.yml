services:
  postgres:
    image: postgres:16-alpine
    container_name: mkt-seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mkt_seo_prod}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mkt} -d ${POSTGRES_DB:-mkt_seo_prod}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mkt-seo-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mkt-seo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-mkt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mkt_seo_prod}?schema=public
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3005
    ports:
      - '127.0.0.1:3005:3005'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mkt-seo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3006
      API_INTERNAL_URL: http://api:3005
    ports:
      - '127.0.0.1:3006:3006'
